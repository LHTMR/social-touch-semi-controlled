# A dependency-aware configuration representing a task graph (DAG) for Postprocessing.
# 'depends_on' specifies which tasks must be completed before this one can run.
# Set 'enabled: false' to skip a task and all tasks that depend on it.
# UPDATED: Task keys now correspond directly to Python function names.

parameters:
  # Set to true to run different sessions in parallel, false to run them one by one.
  parallel_execution: false
  kinect_configs: [valid_configs_ST13-01, valid_configs_ST13-02, 
      valid_configs_ST13-03, valid_configs_ST14-01, valid_configs_ST14-02, 
      valid_configs_ST14-04, valid_configs_ST15-01, valid_configs_ST16-02, 
      valid_configs_ST16-03, valid_configs_ST16-05, valid_configs_ST18-01, 
      valid_configs_ST18-04]

tasks:

  # Step 0: Fetch forearm-of-reference — resolves and copies the canonical forearm PLY.
  fetch_forearm_of_reference:
    enabled: true
    options:
      force_processing: false
    depends_on: []

  # Step 1: ICP Registration — aligns all blocks into a common coordinate frame.
  apply_icp_registration:
    enabled: true
    options:
      force_processing: false
    depends_on: [fetch_forearm_of_reference]

  # Step 2: Deduplicate (x,y) in forearm PLYs and contact_points CSVs.
  deduplicate_xy:
    enabled: true
    options:
      force_processing: false
      monitor: false
      epsilon: 0.5
    depends_on: [apply_icp_registration]

  # Step 3: Project contact points onto the deduplicated forearm surface.
  project_contacts_onto_forearm:
    enabled: true
    options:
      force_processing: false
    depends_on: [deduplicate_xy]

  # Step 4: PCA XYZ calibration — applies PCA transform to CSVs and forearm PLY.
  calibrate_pca_xyz:
    enabled: true
    options:
      force_processing: false
    depends_on: [project_contacts_onto_forearm]

  # Step 5: Center spatial data on the receptive field origin.
  center_on_receptive_field:
    enabled: true
    options:
      force_processing: false
    depends_on: [calibrate_pca_xyz]

  # Step 6: Aggregate fully-processed blocks into one session-level CSV.
  aggregate_session:
    enabled: true
    options:
      force_processing: false
    depends_on: [center_on_receptive_field]

  # Step 7: Export the manually labelled forearm reference point (black dot) into the
  # RF-centred frame -> <session>/manual_label_ref_point.json. Needs the manual task
  # define_manual_label_ref_point; shows FAILURE for sessions that were not labelled.
  export_manual_label_ref_point:
    enabled: true
    options:
      force_processing: false
    depends_on: [center_on_receptive_field]
